# TrackFetch custom color themes
#
# Copy this file next to your main config as themes.ini:
#   ~/.config/trackfetch/themes.ini
# or pass it with --themes-file.
#
# Select a theme in trackfetch.ini:
#   [trackfetch]
#   color_theme = sunset
# or on the command line:
#   trackfetch songs.txt --color-theme sunset
#
# A theme inherits every role it does not override from `base`.
# `base` defaults to cassette and may be any built-in theme or a
# custom theme defined earlier in this file.
#
# Colors: #RRGGBB, #RGB, an xterm 256 index (0-255), an ANSI name
# (red, bright-green, ...) or `default` for the terminal color.

[sunset]
base = cassette
accent = #ff8800
accent_bright = #ffb366
progress = 208
success = bright-green
warning = #ffcc00
error = #ff5555
skip = 244
muted = 240
frame = 238
text = #f2e9de

[forest]
base = neon-tape
accent = #6abf69
accent_bright = #a8e6a3
progress = #d7af00
success = #8fbc6a
warning = #e0a458
error = #d75f5f
skip = 245
muted = 243
frame = 238
text = #e8f0e8
